<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmprendePro Avanzado</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#1e293b;margin:0;padding:0}

/* LOGIN */
.login-container{height:100vh;display:flex;justify-content:center;align-items:center}
.login-box{background:white;padding:40px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1);width:320px;text-align:center}
.login-box input{width:100%;padding:12px;margin-bottom:15px;border-radius:8px;border:1px solid #ccc}
.login-box button{width:100%;padding:12px;border:none;border-radius:8px;background:#2563eb;color:white;font-weight:600;cursor:pointer}

/* APP */
#app{display:none;}
header{background:#0f172a;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
header button{background:#ef4444;color:white;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}

.container{max-width:1200px;margin:25px auto;padding:0 15px}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:25px}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,0.05);transition:0.3s ease;text-align:center}
.card:hover{transform:translateY(-5px)}
.card p{font-size:22px;font-weight:700}

/* Formularios y botones */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:15px}
input,select{padding:12px;border-radius:8px;border:1px solid #ccc}
button{padding:12px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.btn-primary{background:#2563eb;color:white;}
.btn-success{background:#16a34a;color:white;}
.btn-danger{background:#ef4444;color:white;}
.btn-warning{background:#f59e0b;color:white;}

/* Tablas */
.table-container{background:white;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,0.05);overflow-x:auto;margin-bottom:25px}
table{width:100%;border-collapse:collapse;min-width:600px}
th{background:#0f172a;color:white;padding:12px;text-align:center}
td{padding:12px;border-bottom:1px solid #eee;text-align:center}
.stock-bajo{background:#fee2e2}

/* Gráfico */
canvas{background:white;border-radius:14px;padding:15px;box-shadow:0 8px 20px rgba(0,0,0,0.05);margin-bottom:25px}

/* Planes */
.planes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:25px}
.plan-card{background:white;padding:20px;border-radius:14px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,0.05)}
.plan-card h3{color:#2563eb;margin-bottom:10px}

/* Buscadores */
.buscar-container{margin-bottom:15px;display:flex;gap:10px;flex-wrap:wrap}
.buscar-container input{flex:1}

/* Responsive */
@media(max-width:600px){.form-grid{grid-template-columns:1fr}.dashboard{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-container" id="login">
    <div class="login-box">
        <h2>EmprendePro</h2>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="iniciarSesion()">Ingresar</button>
    </div>
</div>

<!-- APP -->
<div id="app">
<header>
    <div>EmprendePro Avanzado</div>
    <button onclick="cerrarSesion()">Cerrar Sesión</button>
</header>

<div class="container">

<!-- Dashboard -->
<div class="dashboard">
    <div class="card">
        <div>Total Productos</div>
        <p id="totalProductos">0</p>
    </div>
    <div class="card">
        <div>Total Ventas</div>
        <p id="totalVentas">$0</p>
    </div>
    <div class="card">
        <div>Productos Stock Bajo</div>
        <p id="stockBajo">0</p>
    </div>
</div>

<!-- Formulario Productos -->
<div class="form-grid">
    <input type="text" id="nombre" placeholder="Producto">
    <input type="number" id="cantidad" placeholder="Cantidad">
    <input type="number" id="precio" placeholder="Precio">
    <button class="btn-primary" onclick="agregarProducto()">Agregar Producto</button>
</div>

<!-- Buscador Productos -->
<div class="buscar-container">
    <input type="text" id="buscarProducto" placeholder="Buscar producto..." oninput="filtrarProductos()">
    <button class="btn-warning" onclick="exportarCSV('productos')">Exportar Productos</button>
</div>

<!-- Tabla Productos -->
<div class="table-container">
<h3>Productos</h3>
<table>
<thead>
<tr>
<th>ID</th><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Total</th><th>Acciones</th>
</tr>
</thead>
<tbody id="tablaProductos"></tbody>
</table>
</div>

<!-- Buscador Ventas -->
<div class="buscar-container">
    <input type="text" id="buscarVentas" placeholder="Buscar ventas..." oninput="filtrarVentas()">
    <button class="btn-warning" onclick="exportarCSV('ventas')">Exportar Ventas</button>
</div>

<!-- Tabla Ventas -->
<div class="table-container">
<h3>Ventas</h3>
<table>
<thead>
<tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Total</th><th>Fecha</th></tr>
</thead>
<tbody id="tablaVentas"></tbody>
</table>
</div>

<!-- Gráfico Ventas -->
<canvas id="graficoVentas" height="200"></canvas>

<!-- Planes de Pago -->
<h3>Planes de Pago</h3>
<div class="planes">
<div class="plan-card"><h3>Básico</h3><p>$10.000/mes</p><button class="btn-primary" onclick="alert('Plan Básico contratado')">Contratar</button></div>
<div class="plan-card"><h3>Pro</h3><p>$20.000/mes</p><button class="btn-primary" onclick="alert('Plan Pro contratado')">Contratar</button></div>
<div class="plan-card"><h3>Premium</h3><p>$30.000/mes</p><button class="btn-primary" onclick="alert('Plan Premium contratado')">Contratar</button></div>
</div>

</div>
</div>

<script>
// Datos
let productos = JSON.parse(localStorage.getItem("productosEmprende")) || [];
let ventas = JSON.parse(localStorage.getItem("ventasEmprende")) || [];
let nextId = productos.length ? Math.max(...productos.map(p=>p.id)) + 1 : 1;

// LOGIN
function iniciarSesion(){
    const usuario = document.getElementById("usuario").value.trim();
    const password = document.getElementById("password").value.trim();
    if(usuario==="admin" && password==="1234"){ localStorage.setItem("sesionActiva","true"); mostrarApp(); }
    else alert("Credenciales incorrectas");
}
function cerrarSesion(){ localStorage.removeItem("sesionActiva"); location.reload(); }
function mostrarApp(){ document.getElementById("login").style.display="none"; document.getElementById("app").style.display="block"; }
if(localStorage.getItem("sesionActiva")==="true"){ mostrarApp(); }

// Guardar
function guardar(){ localStorage.setItem("productosEmprende",JSON.stringify(productos)); localStorage.setItem("ventasEmprende",JSON.stringify(ventas)); }
function formatoCLP(valor){ return valor.toLocaleString("es-CL",{style:"currency",currency:"CLP"}); }

// Agregar Producto
function agregarProducto(){
    const nombre=document.getElementById("nombre").value.trim();
    const cantidad=parseInt(document.getElementById("cantidad").value);
    const precio=parseFloat(document.getElementById("precio").value);
    if(!nombre || isNaN(cantidad)||isNaN(precio)){ alert("Complete los campos"); return; }
    productos.push({id:nextId++,nombre,cantidad,precio});
    document.getElementById("nombre").value=""; document.getElementById("cantidad").value=""; document.getElementById("precio").value="";
    guardar(); mostrarProductos(); actualizarGrafico();
}

// Mostrar Productos
function mostrarProductos(filtered=productos){
    const tabla=document.getElementById("tablaProductos");
    tabla.innerHTML="";
    filtered.forEach((p,index)=>{
        const stockClass = p.cantidad <= 2 ? 'stock-bajo' : '';
        tabla.innerHTML+=`<tr class="${stockClass}">
        <td>${p.id}</td>
        <td>${p.nombre}</td>
        <td>${p.cantidad}</td>
        <td>${formatoCLP(p.precio)}</td>
        <td>${formatoCLP(p.cantidad*p.precio)}</td>
        <td>
            <button class="btn-success" onclick="registrarVenta(${p.id})">Vender</button>
            <button class="btn-warning" onclick="editarProducto(${p.id})">Editar</button>
            <button class="btn-danger" onclick="eliminarProducto(${p.id})">Eliminar</button>
        </td>
        </tr>`;
    });
    document.getElementById("totalProductos").innerText=productos.reduce((sum,p)=>sum+p.cantidad,0);
    document.getElementById("stockBajo").innerText=productos.filter(p=>p.cantidad<=2).length;
}

// Filtrar Productos
function filtrarProductos(){
    const query=document.getElementById("buscarProducto").value.toLowerCase();
    mostrarProductos(productos.filter(p=>p.nombre.toLowerCase().includes(query)));
}

// Filtrar Ventas
function filtrarVentas(){
    const query=document.getElementById("buscarVentas").value.toLowerCase();
    mostrarVentas(ventas.filter(v=>v.nombre.toLowerCase().includes(query)));
}

// Editar Producto
function editarProducto(id){
    const index = productos.findIndex(p=>p.id===id);
    const nuevoNombre = prompt("Nombre del producto", productos[index].nombre);
    const nuevaCantidad = parseInt(prompt("Cantidad", productos[index].cantidad));
    const nuevoPrecio = parseFloat(prompt("Precio", productos[index].precio));
    if(nuevoNombre && !isNaN(nuevaCantidad) && !isNaN(nuevoPrecio)){
        productos[index] = { ...productos[index], nombre: nuevoNombre, cantidad: nuevaCantidad, precio: nuevoPrecio };
        guardar(); mostrarProductos(); actualizarGrafico();
    }
}

// Eliminar Producto
function eliminarProducto(id){
    if(confirm("Eliminar producto?")){
        productos = productos.filter(p=>p.id!==id);
        guardar(); mostrarProductos(); actualizarGrafico();
    }
}

// Registrar Venta
function registrarVenta(id){
    const index = productos.findIndex(p=>p.id===id);
    let cant=prompt("Cantidad a vender","1"); cant=parseInt(cant);
    if(isNaN(cant)||cant<=0||cant>productos[index].cantidad){ alert("Cantidad inválida"); return; }
    let p=productos[index]; p.cantidad-=cant;
    let total=cant*p.precio;
    const fecha=new Date().toLocaleString();
    ventas.push({nombre:p.nombre,cantidad:cant,precio:p.precio,total,fecha});
    guardar(); mostrarProductos(); mostrarVentas(); actualizarGrafico();
}

// Mostrar Ventas
function mostrarVentas(filtered=ventas){
    const tabla=document.getElementById("tablaVentas");
    tabla.innerHTML="";
    let totalVentas=0;
    filtered.forEach(v=>{
        totalVentas+=v.total;
        tabla.innerHTML+=`<tr>
        <td>${v.nombre}</td>
        <td>${v.cantidad}</td>
        <td>${formatoCLP(v.precio)}</td>
        <td>${formatoCLP(v.total)}</td>
        <td>${v.fecha}</td>
        </tr>`;
    });
    document.getElementById("totalVentas").innerText=formatoCLP(totalVentas);
}

// Exportar CSV
function exportarCSV(tipo){
    let csvContent="";
    if(tipo==='productos'){
        csvContent="ID,Producto,Cantidad,Precio,Total\n";
        productos.forEach(p=>{csvContent+=`${p.id},${p.nombre},${p.cantidad},${p.precio},${p.cantidad*p.precio}\n`;});
    }else{
        csvContent="Producto,Cantidad,Precio,Total,Fecha\n";
        ventas.forEach(v=>{csvContent+=`${v.nombre},${v.cantidad},${v.precio},${v.total},${v.fecha}\n`;});
    }
    const blob=new Blob([csvContent],{type:'text/csv;charset=utf-8;'});
    const link=document.createElement("a");
    link.href=URL.createObjectURL(blob);
    link.download=`${tipo}.csv`;
    link.click();
}

// Gráfico Ventas
let chart;
function actualizarGrafico(){
    const ctx=document.getElementById("graficoVentas").getContext("2d");
    const labels = [...new Set(ventas.map(v=>v.nombre))];
    const data = labels.map(label => ventas.filter(v=>v.nombre===label).reduce((sum,v)=>sum+v.total,0));
    const colors = labels.map(_=>`hsl(${Math.random()*360},70%,50%)`);
    if(chart) chart.destroy();
    chart=new Chart(ctx,{
        type:'bar',
        data:{labels,datasets:[{label:'Ventas',data,backgroundColor:colors}]},
        options:{responsive:true,plugins:{legend:{display:false}}}
    });
}

mostrarProductos(); mostrarVentas(); actualizarGrafico();
</script>
</body>
</html>
